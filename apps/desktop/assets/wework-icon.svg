<!--
  Wework 标识：一个「W」加一条底座组成的皇冠。

  - W 是一笔粗线折线：三个顶端与两个谷底都用同两条水平线切平——不加水平短枝，
    所以尖端不会甩出小凸起，转折处只有折线本身的角；
  - 底座是描边矩形（细一点的那条），长度与 W 的**底部**宽度一致；
  - 底座宽度由 scripts/build-icon.mjs 实测对齐成与 W 的横向跨度一致。

  viewBox 同样由该脚本按实测外接框校正成正方形；改坐标后重跑 `npm run icon` 即可。
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="3.375 7.938 57.25 57.25"
  width="64"
  height="64"
  fill="none"
  stroke="currentColor"
  stroke-linecap="butt"
  stroke-linejoin="miter"
>
  <defs>
    <!-- 上切线与下切线：W 的三个尖切到 y=10，两个谷底切到 y=46。 -->
    <clipPath id="wework-w-flat" clipPathUnits="userSpaceOnUse">
      <rect x="0" y="10" width="64" height="36" />
    </clipPath>
  </defs>
  <polyline
    id="w-outer"
    points="6 4 16 52 32 4 48 52 58 4"
    stroke-width="7.5"
    clip-path="url(#wework-w-flat)"
  />
  <rect id="w-base" x="12.1" y="53" width="39.8" height="8" stroke-width="4.2" />
</svg>
